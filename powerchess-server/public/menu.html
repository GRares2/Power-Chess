<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerChess</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --dark: #0a0a0f;
    --dark-2: #12121a;
    --dark-3: #1a1a28;
    --dark-4: #22223a;
    --border: #2a2a45;
    --text: #e8e0d0;
    --text-dim: #8a8070;
    --white-piece: #f0ece0;
    --black-piece: #1a1a2e;
    --error: #c0392b;
    --success: #27ae60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Crimson Text', Georgia, serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background board */
  .bg-board {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
  }
  .bg-cell { }
  .bg-cell.light { background: #fff; }
  .bg-cell.dark  { background: transparent; }

  /* Glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: drift 12s ease-in-out infinite;
  }
  .orb-1 { width: 400px; height: 400px; background: rgba(201,168,76,0.08); top: -100px; left: -100px; }
  .orb-2 { width: 300px; height: 300px; background: rgba(100,80,200,0.06); bottom: -50px; right: -50px; animation-delay: -6s; }
  @keyframes drift {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(30px, 20px); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    padding: 0 24px;
  }

  /* HEADER */
  .logo {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.8s ease both;
  }
  .logo-icon {
    font-size: 64px;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.4));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .logo h1 {
    font-family: 'Cinzel', serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }
  .logo p {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* STEPS */
  .step {
    background: var(--dark-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    animation: fadeUp 0.6s ease both;
    display: none;
  }
  .step.active { display: block; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }

  .step-title {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 24px;
    text-align: center;
    text-transform: uppercase;
  }

  .step-subtitle {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 20px;
  }

  /* INPUTS */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--dark-3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 6px;
    font-family: 'Crimson Text', serif;
    font-size: 16px;
    transition: border-color 0.2s;
    outline: none;
  }
  .field input:focus { border-color: var(--gold); }
  .field input::placeholder { color: var(--text-dim); }

  /* COLOR CHOICE */
  .color-choice {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 8px 0 24px;
  }
  .color-btn {
    padding: 20px 16px;
    border-radius: 8px;
    border: 2px solid var(--border);
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    background: var(--dark-3);
  }
  .color-btn:hover { border-color: var(--gold); transform: translateY(-2px); }
  .color-btn.selected-white { border-color: #e8e0d0; background: rgba(232,224,208,0.08); }
  .color-btn.selected-black { border-color: #6b6b9a; background: rgba(30,30,60,0.5); }
  .color-btn .piece-big { font-size: 48px; display: block; margin-bottom: 8px; }
  .color-btn .color-name {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .color-btn.white-btn .color-name { color: #e8e0d0; }
  .color-btn.black-btn .color-name { color: #9090c0; }
  .color-btn .color-desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* PLAYER SUMMARY */
  .players-summary {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .player-card {
    flex: 1;
    background: var(--dark-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .player-card .pc-piece { font-size: 32px; display: block; margin-bottom: 6px; }
  .player-card .pc-name { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); word-break: break-word; }
  .player-card .pc-color { font-size: 11px; color: var(--text-dim); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

  /* BUTTONS */
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-gold {
    background: linear-gradient(135deg, #b8922a, var(--gold), #b8922a);
    color: #0a0a0f;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.3); }
  .btn-gold:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    margin-top: 12px;
  }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

  /* ERROR */
  .err-msg {
    background: rgba(192,57,43,0.15);
    border: 1px solid var(--error);
    color: #e74c3c;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .err-msg.show { display: block; }

  /* DIVIDER */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .divider::before,.divider::after {
    content:'';
    flex:1;
    height:1px;
    background: var(--border);
  }

  /* SERVER STATUS */
  .server-status {
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 20px;
    color: var(--text-dim);
  }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: #e74c3c; }
  .dot.online { background: #27ae60; }

  /* LOADING */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(201,168,76,0.3);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* STEP INDICATOR */
  .steps-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  .step-dot.active { background: var(--gold); }
  .step-dot.done   { background: rgba(201,168,76,0.4); }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-board" id="bg-board"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <span class="logo-icon">♟</span>
    <h1>PowerChess</h1>
    <p>Șah cu superputeri</p>
  </div>

  <!-- STEP INDICATOR -->
  <div class="steps-indicator">
    <div class="step-dot active" id="dot-1"></div>
    <div class="step-dot" id="dot-2"></div>
    <div class="step-dot" id="dot-3"></div>
  </div>

  <!-- STEP 1: Jucătorul 1 -->
  <div class="step active" id="step-1">
    <div class="step-title">Jucător 1</div>
    <div class="step-subtitle">Introdu numele tău</div>
    <div class="err-msg" id="err-1"></div>
    <div class="field">
      <label>Nume jucător</label>
      <input type="text" id="name-1" placeholder="ex: Marius" maxlength="20" autocomplete="off">
    </div>
    <button class="btn btn-gold" onclick="goStep2()">Continuă →</button>
  </div>

  <!-- STEP 2: Jucătorul 2 -->
  <div class="step" id="step-2">
    <div class="step-title">Jucător 2</div>
    <div class="step-subtitle">Introdu numele tău</div>
    <div class="err-msg" id="err-2"></div>
    <div class="field">
      <label>Nume jucător</label>
      <input type="text" id="name-2" placeholder="ex: Alexandru" maxlength="20" autocomplete="off">
    </div>
    <button class="btn btn-gold" onclick="goStep3()">Continuă →</button>
    <button class="btn btn-ghost" onclick="goBack(1)">← Înapoi</button>
  </div>

  <!-- STEP 3: Alegere culori + Start -->
  <div class="step" id="step-3">
    <div class="step-title">Alege Culoarea</div>
    <div class="step-subtitle" id="color-prompt"></div>
    <div class="err-msg" id="err-3"></div>

    <div class="color-choice">
      <div class="color-btn white-btn" id="btn-white" onclick="selectColor('white')">
        <span class="piece-big">♔</span>
        <div class="color-name">Alb</div>
        <div class="color-desc">Mută primul</div>
      </div>
      <div class="color-btn black-btn" id="btn-black" onclick="selectColor('black')">
        <span class="piece-big">♚</span>
        <div class="color-name">Negru</div>
        <div class="color-desc">Mută al doilea</div>
      </div>
    </div>

    <div class="divider">Rezumat joc</div>

    <div class="players-summary" id="players-summary"></div>

    <button class="btn btn-gold" id="start-btn" onclick="startGame()" disabled>
      Începe Jocul ♟
    </button>
    <button class="btn btn-ghost" onclick="goBack(2)">← Înapoi</button>
  </div>

</div>

<div class="server-status">
  <span class="dot" id="srv-dot"></span>
  <span id="srv-text">Se verifică serverul...</span>
</div>

<script>
const BASE = window.location.origin.includes('powerchess.local') 
  ? 'http://powerchess.local' 
  : 'http://localhost:8080';

// State
let p1Name = '', p2Name = '';
let p1Color = null, p2Color = null;
// Cine alege acum: 1 = jucatorul 1, 2 = jucatorul 2
let choosingPlayer = 1;

// Build background board
const bg = document.getElementById('bg-board');
for (let r = 0; r < 8; r++)
  for (let c = 0; c < 8; c++) {
    const d = document.createElement('div');
    d.className = 'bg-cell ' + ((r+c)%2===0 ? 'light' : 'dark');
    bg.appendChild(d);
  }

// Server check
async function checkServer() {
  const dot  = document.getElementById('srv-dot');
  const text = document.getElementById('srv-text');
  try {
    const res = await fetch(`${BASE}/games`, { signal: AbortSignal.timeout(2000) });
    if (res.ok) {
      dot.className  = 'dot online';
      text.textContent = 'Server online';
    } else {
      dot.className  = 'dot';
      text.textContent = 'Server error';
    }
  } catch {
    dot.className  = 'dot';
    text.textContent = 'Server offline — pornește: php -S localhost:8080 -t public';
  }
}
checkServer();
setInterval(checkServer, 8000);

// Step navigation
function setStep(n) {
  [1,2,3].forEach(i => {
    document.getElementById(`step-${i}`).classList.toggle('active', i===n);
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'step-dot' + (i===n ? ' active' : i<n ? ' done' : '');
  });
}

function goStep2() {
  const name = document.getElementById('name-1').value.trim();
  if (!name) { showErr('err-1', 'Te rog introdu un nume!'); return; }
  p1Name = name;
  setStep(2);
  document.getElementById('name-2').focus();
}

function goStep3() {
  const name = document.getElementById('name-2').value.trim();
  if (!name) { showErr('err-2', 'Te rog introdu un nume!'); return; }
  if (name === p1Name) { showErr('err-2', 'Numele trebuie să fie diferit!'); return; }
  p2Name = name;
  // Jucatorul 1 alege primul culoarea
  choosingPlayer = 1;
  p1Color = null; p2Color = null;
  document.getElementById('color-prompt').textContent = `${p1Name}, alege culoarea ta:`;
  updateColorButtons();
  updateSummary();
  setStep(3);
}

function goBack(to) {
  p1Color = null; p2Color = null;
  setStep(to);
}

function selectColor(color) {
  if (choosingPlayer === 1) {
    p1Color = color;
    p2Color = color === 'white' ? 'black' : 'white';
    choosingPlayer = 2;
    document.getElementById('color-prompt').textContent =
      `${p2Name}, culoarea ta va fi ${p2Color === 'white' ? 'Alb' : 'Negru'}.`;
  }
  updateColorButtons();
  updateSummary();
  document.getElementById('start-btn').disabled = false;
}

function updateColorButtons() {
  const wb = document.getElementById('btn-white');
  const bb = document.getElementById('btn-black');
  wb.className = 'color-btn white-btn' + (p1Color==='white' ? ' selected-white' : p1Color==='black' ? ' selected-black' : '');
  bb.className = 'color-btn black-btn' + (p1Color==='black' ? ' selected-black' : p1Color==='white' ? ' selected-white' : '');

  // Daca jucatorul 1 a ales deja, dezactiveaza butoanele
  if (p1Color) {
    wb.style.opacity = '0.6';
    bb.style.opacity = '0.6';
    wb.style.cursor  = 'default';
    bb.style.cursor  = 'default';
    wb.onclick = null;
    bb.onclick = null;
  }
}

function updateSummary() {
  const panel = document.getElementById('players-summary');
  const c1 = p1Color || '?';
  const c2 = p2Color || '?';
  panel.innerHTML = `
    <div class="player-card">
      <span class="pc-piece">${c1==='white'?'♔':c1==='black'?'♚':'♟'}</span>
      <div class="pc-name">${p1Name}</div>
      <div class="pc-color">${c1==='white'?'Alb':c1==='black'?'Negru':'Neales'}</div>
    </div>
    <div class="player-card">
      <span class="pc-piece">${c2==='white'?'♔':c2==='black'?'♚':'♟'}</span>
      <div class="pc-name">${p2Name}</div>
      <div class="pc-color">${c2==='white'?'Alb':c2==='black'?'Negru':'Neales'}</div>
    </div>
  `;
}

async function startGame() {
  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Se creează jocul...';

  try {
    // Creeaza jucator 1
    const r1 = await fetch(`${BASE}/players`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: p1Name, email: `${p1Name.toLowerCase()}@powerchess.io` })
    });
    const player1 = await r1.json();

    // Creeaza jucator 2
    const r2 = await fetch(`${BASE}/players`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: p2Name, email: `${p2Name.toLowerCase()}@powerchess.io` })
    });
    const player2 = await r2.json();

    // Determina whitPlayerId / blackPlayerId
    const whiteId = p1Color === 'white' ? player1.id : player2.id;
    const blackId = p1Color === 'black' ? player1.id : player2.id;

    // Creeaza jocul
    const rg = await fetch(`${BASE}/games`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ whitePlayerId: whiteId, blackPlayerId: blackId, powerSpawnInterval: 3 })
    });
    const game = await rg.json();

    // Redirectioneaza la tabla de joc
    window.location.href = `game.html?gameId=${game.id}`;

  } catch(e) {
    showErr('err-3', 'Eroare la crearea jocului. Serverul rulează?');
    btn.disabled = false;
    btn.textContent = 'Începe Jocul ♟';
  }
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Enter key support
document.getElementById('name-1').addEventListener('keydown', e => { if(e.key==='Enter') goStep2(); });
document.getElementById('name-2').addEventListener('keydown', e => { if(e.key==='Enter') goStep3(); });
document.getElementById('name-1').focus();
</script>
</body>
</html>
